name: Build RTL8812AU for Kernel 4.4.205

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout driver
      uses: actions/checkout@v3

    - name: Clone kernel source
      run: |
        git clone https://github.com/thongass000/android_kernel_samsung_a9y18qlte.git kernel

    - name: Download Android NDK
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
        unzip android-ndk-r21e-linux-x86_64.zip
        echo "NDK downloaded"

    - name: Set environment variables
      run: |
        echo "Setting up environment"
        export NDK=$PWD/android-ndk-r21e
        export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export ARCH=arm64
        export KERNEL_SRC=$PWD/kernel

    - name: Prepare kernel headers
      run: |
        cd kernel
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- a9y18qlte_defconfig
        cd ..

    - name: Build module
      run: |
        make ARCH=arm64 CROSS
